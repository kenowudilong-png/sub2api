name: YesYeah Theme Image Reusable

on:
  workflow_call:
    inputs:
      checkout_ref:
        required: true
        type: string

env:
  UPSTREAM_REPO: ${{ vars.YESYEAH_UPSTREAM_REPO || 'Wei-Shaw/sub2api' }}

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        run: |
          set -euo pipefail

          owner_lower="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner_lower}/sub2api"
          short_sha="$(git rev-parse --short=7 HEAD)"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch upstream --tags --quiet

          upstream_tag="$(git tag --merged HEAD --sort=-v:refname 'v*' | head -n1 || true)"
          version="${upstream_tag#v}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          {
            echo "image=${image}"
            echo "short_sha=${short_sha}"
            echo "version=${version}"
            echo "upstream_tag=${upstream_tag}"
            echo "build_date=${build_date}"
            echo "tags<<EOF"
            echo "${image}:yesyeah-theme"
            echo "${image}:yesyeah-theme-${short_sha}"
            if [[ -n "${upstream_tag}" ]]; then
              echo "${image}:${upstream_tag}-yesyeah-theme"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.upstream_tag }}

      - name: Job summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          UPSTREAM_TAG: ${{ steps.meta.outputs.upstream_tag }}
        run: |
          {
            echo "## YesYeah Theme Image"
            echo
            echo "- Image: \`${IMAGE}\`"
            echo "- Tags:"
            while IFS= read -r line; do
              [[ -n "${line}" ]] && echo "  - \`${line}\`"
            done <<< "${TAGS}"
            if [[ -n "${UPSTREAM_TAG}" ]]; then
              echo "- Upstream tag: \`${UPSTREAM_TAG}\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
